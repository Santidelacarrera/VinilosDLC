[build]
  command = "npm run check"
  functions = "netlify/functions"
  publish = "public"

[functions]
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22"
  # SITE_URL, MUSICBRAINZ_CONTACT y SUPABASE_URL son URLs públicas que aparecen en la documentación.
  # Ningún valor de secreto está en el repo (verificado); estas claves dan falsos positivos.
  SECRETS_SCAN_OMIT_KEYS = "SITE_URL,MUSICBRAINZ_CONTACT,SUPABASE_URL"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'none'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' https:; media-src 'self' https:; object-src 'none'; script-src 'self'; style-src 'self'; upgrade-insecure-requests"
    Permissions-Policy = "camera=(), geolocation=(), microphone=(), payment=(), usb=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
